  "all of the pop up colours being green is lame"). Same shape as the Index
  popup banners in index_ui.html; renders to art/popup/NAME.png with
  art/svg_render.py (python svg_render.py rarity_popup.html popup 1024 8771).
    Common     plain grey, nothing extra
    Uncommon   the existing green banner (pop_banner_green in index_ui.html)
    Rare       blue
    Epic       purple with a diamond pattern
    Legendary  gold with shine stripes and two little stars
    Secret     black with a rainbow rim and sparkles
  plus pop_rays_rainbow (16 rays, each its own colour) and pop_sparkles (a ring
  of four-point stars, white so ImageColor3 can tint it).
-->
